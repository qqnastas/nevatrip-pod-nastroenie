name: Обновление каталога

on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17 (время UTC)
  workflow_dispatch: {}    # кнопка «Run workflow» для ручного запуска

concurrency:
  group: update-catalog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Скрипт сам ничего не затирает: при сбое прежний data/catalog.json остается как был
      - name: Собрать каталог
        id: build
        run: python scripts/build_catalog.py

      - name: Отчет в сводку запуска
        if: always()
        run: |
          if [ -f data/report.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat data/report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Сохранить, если каталог изменился
        id: save
        if: success()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/catalog.json data/report.txt
          if git diff --cached --quiet; then
            echo "Изменений нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Обновление каталога"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Публикуем сайт, если каталог изменился или запуск ручной
      - name: Собрать папку сайта
        if: success() && (steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp data/catalog.json _site/catalog.json

      - uses: actions/configure-pages@v5
        if: success() && (steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')

      - uses: actions/upload-pages-artifact@v3
        if: success() && (steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        with:
          path: _site

      - name: Опубликовать на GitHub Pages
        id: deploy
        if: success() && (steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/deploy-pages@v4

      # Если сбор упал, заводим issue (один открытый на все сбои подряд)
      - name: Уведомить о сбое
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create catalog-failed --color B60205 --description "Обновление каталога упало" 2>/dev/null || true
          OPEN=$(gh issue list --label catalog-failed --state open --json number --jq '.[0].number')
          BODY="Обновление каталога не удалось. Пока работает последняя рабочая версия data/catalog.json. Запуск: $RUN_URL"
          if [ -z "$OPEN" ]; then
            gh issue create --title "Каталог не обновился" --label catalog-failed --body "$BODY"
          else
            gh issue comment "$OPEN" --body "$BODY"
          fi
